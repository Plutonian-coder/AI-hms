# HMS — Render Deployment (Factor V: Build, Release, Run)
# Env vars are aligned with config.py's _require() pattern.
services:
  - type: web
    name: hms-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: JWT_EXPIRY_MINUTES
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HMS_APP_URL
        sync: false
      - key: UPLOAD_DIR
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_POOL_MIN
        sync: false
      - key: DB_POOL_MAX
        sync: false
      # Email — Google Apps Script (primary) / Gmail SMTP (fallback)
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      # AWS S3 — file storage (photos, medical docs)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
