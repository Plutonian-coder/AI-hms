# FUOYE HMS backend — Nginx reverse proxy (Docker container on 127.0.0.1:8000)
#
# Several endpoints (payment verify, quiz submit, eligibility upload) stream
# Server-Sent Events. proxy_buffering must stay off and proxy_read_timeout
# generous, or Nginx will buffer/cut the stream and the frontend will hang.
#
# Install to /etc/nginx/sites-available/hms-backend, symlink into
# sites-enabled, then run `certbot --nginx` against the server_name below —
# certbot rewrites this file in place to add the TLS server block.

server {
    listen 80;
    server_name __SERVER_NAME__;

    client_max_body_size 15M;   # photo / medical-document uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support — do not buffer, keep the connection open
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
}
