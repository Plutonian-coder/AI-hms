# ══════════════════════════════════════════════════════════════════════════════
# HMS CI/CD Pipeline (Factor V: Build, Release, Run)
# ══════════════════════════════════════════════════════════════════════════════
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Test Backend ──────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          cd backend && flake8 --max-line-length=150 --exclude=__pycache__,migrations .
        continue-on-error: true

      - name: Run tests
        run: cd backend && python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ci-test-secret-not-real
          PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
          GEMINI_API_KEY: ci-test-placeholder
          RESEND_API_KEY: re_ci_test_placeholder

  # ── Lint Frontend ───────────────────────────────────────────────────────
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint
        continue-on-error: true

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  # ── Build & Push Docker Images ──────────────────────────────────────────
  build-images:
    needs: [test-backend, lint-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Backend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
                        -t ghcr.io/${{ github.repository }}/backend:latest \
                        ./backend
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
                        -t ghcr.io/${{ github.repository }}/frontend:latest \
                        --build-arg VITE_API_URL=${{ vars.PROD_API_URL }} \
                        ./frontend
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/frontend:latest
